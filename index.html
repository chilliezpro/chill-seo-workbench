<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolkits by Chill</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-logo" style="font-family: var(--font-display);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="1.6">
        <path d="M14.7 6.3a4 4 0 0 1 5.4 5.4l-8.5 8.5a2 2 0 0 1-2.8 0l-2.7-2.7a2 2 0 0 1 0-2.8l8.5-8.5a4 4 0 0 1 .1 0z"/>
        <circle cx="9" cy="15" r="1"/>
      </svg>
      Toolkits by Chill
    </div>
    <img src="assets/mascot_v2_header_avatar.png" class="avatar-circle" alt="Chill">
  </header>

  <p style="text-align: center; color: var(--text-secondary); font-size: 14px; padding: 20px 24px 0;">Built by hand. Used every day.</p>

  <div class="container" style="position: relative;">

    <div class="blueprint-bg"></div>

    <svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute; top:0; left:0; opacity:0.15;">
      <line x1="8" y1="2" x2="8" y2="14" stroke="var(--text-secondary)" stroke-width="1"/>
      <line x1="2" y1="8" x2="14" y2="8" stroke="var(--text-secondary)" stroke-width="1"/>
    </svg>
    <svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute; top:0; right:24px; opacity:0.15;">
      <line x1="8" y1="2" x2="8" y2="14" stroke="var(--text-secondary)" stroke-width="1"/>
      <line x1="2" y1="8" x2="14" y2="8" stroke="var(--text-secondary)" stroke-width="1"/>
    </svg>
    <svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute; bottom:0; left:0; opacity:0.15;">
      <line x1="8" y1="2" x2="8" y2="14" stroke="var(--text-secondary)" stroke-width="1"/>
      <line x1="2" y1="8" x2="14" y2="8" stroke="var(--text-secondary)" stroke-width="1"/>
    </svg>
    <svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute; bottom:0; right:24px; opacity:0.15;">
      <line x1="8" y1="2" x2="8" y2="14" stroke="var(--text-secondary)" stroke-width="1"/>
      <line x1="2" y1="8" x2="14" y2="8" stroke="var(--text-secondary)" stroke-width="1"/>
    </svg>

    <div class="portal-cards">

      <!-- ASN Workbench -->
      <div class="card drawer-asn" style="display: flex; flex-direction: column; gap: 16px; padding: 32px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
        <div class="portal-card-title">ASN Workbench</div>
        <div class="portal-card-desc">briefs · optimization · reports</div>
        <a href="/asn/index.html" class="btn-primary" style="align-self: flex-start; margin-top: 4px;">
          Open drawer →
        </a>
      </div>

      <!-- SSP Content Engine -->
      <div class="card drawer-ssp" style="display: flex; flex-direction: column; gap: 16px; padding: 32px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="10 8 16 12 10 16 10 8"/>
        </svg>
        <div class="portal-card-title">SSP Content Engine</div>
        <div class="portal-card-desc">scripts · captions · landing pages · visuals</div>
        <a href="/ssp/index.html" class="btn-primary" style="align-self: flex-start; margin-top: 4px;">
          Open drawer →
        </a>
      </div>

    </div>
  </div>

  <footer class="site-footer">
    <img src="assets/mascot_v2_transparent.png" class="mascot-footer" alt="Chill, holding his tools">
    tools.streamseopros.com · Internal use only
    <div style="font-size: 11px; margin-top: 4px;">A project by Chill · <a href="https://streamseopros.com" target="_blank" rel="noopener">streamseopros.com</a></div>
  </footer>

</body>
</html>
